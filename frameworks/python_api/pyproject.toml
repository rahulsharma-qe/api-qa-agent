[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "api-test-framework"
version = "0.1.0"
description = "A small, plain API test framework on pytest and httpx: environments, chained steps, readable failures."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pytest>=8",
    "openpyxl>=3.1",     # test data from Excel
]

[project.entry-points.pytest11]
api_test_framework = "api_test_framework.pytest_plugin"

[tool.setuptools.packages.find]
include = ["api_test_framework*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
