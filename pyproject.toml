[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "api-qa-agent"
version = "0.4.0"
description = "AI drafts, humans approve: runnable API tests from your API description, acceptance criteria and existing test cases."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",     # the reference API (demo_api)
    "uvicorn>=0.29",
    "httpx>=0.27",        # env_check
    "pyyaml>=6.0",
    "openpyxl>=3.1",      # qa-agent: Excel data files and sheets
    "jinja2>=3.1",        # qa-agent: the templates that write tests
]

[project.scripts]
qa-agent = "qa_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
anthropic = ["anthropic>=0.40"]   # the AI layer with ai.provider anthropic
openai = ["openai>=1.40"]         # the AI layer with ai.provider openai

[tool.setuptools.packages.find]
include = ["demo_api*", "env_check*", "qa_agent*"]

[tool.setuptools.package-data]
demo_api = ["openapi.json"]
qa_agent = ["renderers/templates/*", "project_templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]       # each framework under frameworks/ runs its own tests
