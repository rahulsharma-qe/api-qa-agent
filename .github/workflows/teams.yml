# Two teams, two stacks, one line of CI each: the reusable workflow, as a team's own repository
# would call it (here from this checkout, so the teams test the platform's current code).
name: Teams

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  bookings-python:
    uses: ./.github/workflows/qa-agent-team.yml
    with:
      stack: python
      project-path: teams/bookings-python
      name: bookings-python
      start-reference-api: true
      platform-from-checkout: true

  refunds-java:
    uses: ./.github/workflows/qa-agent-team.yml
    with:
      stack: restassured
      project-path: teams/refunds-java
      name: refunds-java
      start-reference-api: true
      platform-from-checkout: true
