          body: {cancelled_at: '2026-01-15T11:00:00Z'}
        expect: {status: 200}
      - request:
          method: POST
          path: /bookings/{{pnr}}/cancel
          body: {cancelled_at: '2026-01-15T12:00:00Z'}
        expect:
          status: 409
          fields: {error.code: TBD}
    review:
      status: rejected
      by: qa-lead
      date: '2026-10-24'
      comment: 'A second cancel answers 409 with error code already_cancelled (the API''s error list): check that
        code, not TBD (replaced by TC011)'
