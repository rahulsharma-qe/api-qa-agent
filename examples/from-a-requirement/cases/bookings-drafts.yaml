feature: Bookings (drafted)
cases:
  - id: TC001
    title: A booking cancelled one hour after it was made gets a full refund
    criteria: [AC-1]
    priority: P0
    suite: functional
    source: {kind: ai-draft, model: 'recorded:recorded', gap: AC-1}
    steps:
      - request:
          method: POST
          path: /bookings
          body:
            passenger_name: Ravi Kumar {{unique}}
            email: ravi.{{unique}}@testdata.example
            amount: 250
            booked_at: '2026-01-15T10:00:00Z'
        expect: {status: 201}
        capture: {pnr: pnr}
      - request:
          method: POST
          path: /bookings/{{pnr}}/cancel
          body: {cancelled_at: '2026-01-15T11:00:00Z'}
        expect:
          status: 200
          fields: {refund_allowed: true, refund_amount: 250}
    review:
      status: approved
      by: qa-lead
      date: '2026-10-24'
      fingerprint: d0240318751a
