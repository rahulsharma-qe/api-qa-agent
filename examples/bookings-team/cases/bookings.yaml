feature: Bookings
cases:
  - id: TC001
    title: A new booking can be read back by its PNR
    criteria: [AC-1]
    priority: P1
    track: functional
    tags: [smoke]
    steps:
      - request:
          method: POST
          path: /bookings
          body:
            passenger_name: Asha Rao {{unique}}
            email: asha.{{unique}}@testdata.example
            amount: 250
        expect:
          status: 201
          fields: {status: active}
        capture: {pnr: pnr}
      - request: {method: GET, path: '/bookings/{{pnr}}'}
        expect:
          status: 200
          fields: {pnr: '{{pnr}}', amount: 250}
    review:
      status: approved
      by: qa-lead
      date: '2026-10-21'
      fingerprint: 40b11c4af3ed
  - id: TC005
    title: A booking without an email is refused
    criteria: [AC-1]
    priority: P2
    track: functional
    tags: [negative]
    steps:
      - request:
          method: POST
          path: /bookings
          body: {passenger_name: 'Asha Rao {{unique}}', amount: 250}
        expect: {status: 400}
    review:
      status: changes_needed
      by: qa-lead
      date: '2026-10-21'
      comment: The API returns 422 for a missing field, not 400
