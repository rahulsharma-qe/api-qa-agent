# The team's API tests on every change, with the platform's reusable workflow: the environment is
# ready, the generated tests match the approved cases, the tests (REST Assured), the trace.
name: API tests

on:
  push:
  pull_request:

jobs:
  api-tests:
    # @main because this project tests this repository's own code; a team's project pins a release,
    # as qa-agent init writes it.
    uses: rahulsharma-qe/api-qa-agent/.github/workflows/qa-agent-team.yml@main
    with:
      framework: restassured
      environment: demo                 # an environment in config/environments.yaml
      name: refunds-java
      start-reference-api: true         # the reference API; remove it when you test your own environment
      # min-coverage: "80"              # a floor for criteria and operations coverage, if the team wants one
